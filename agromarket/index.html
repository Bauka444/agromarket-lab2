<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АгроМаркет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>АгроМаркет</h1>
  </header>

  <main>
    <section class="catalog">
      <h2>Каталог</h2>
      <div class="cards">
        <article class="card">
          <img src="https://placehold.co/300x200" alt="Картофель, 1 кг">
          <h3>Картофель, 1 кг</h3>
          <p>350 тг</p>
          <button>В корзину</button>
        </article>
        <article class="card">
          <img src="https://placehold.co/300x200" alt="Мёд натуральный, 1 л">
          <h3>Мёд натуральный, 1 л</h3>
          <p>4500 тг</p>
          <button>В корзину</button>
        </article>
        <article class="card">
          <img src="https://placehold.co/300x200" alt="Молоко фермерское, 1 л">
          <h3>Молоко фермерское, 1 л</h3>
          <p>600 тг</p>
          <button>В корзину</button>
        </article>
        <article class="card">
          <img src="https://placehold.co/300x200" alt="Яйца куриные, 10 шт">
          <h3>Яйца куриные, 10 шт</h3>
          <p>900 тг</p>
          <button>В корзину</button>
        </article>
      </div>
    </section>
  </main>

  <footer>АгроМаркет · учебный проект</footer>
</body>
</html>
